<svg xmlns="http://www.w3.org/2000/svg" width="220" height="122" viewBox="0 0 220 122" role="img" aria-label="Roadalyx">
  <!-- the mark: a road in perspective, drawn in, then a crash on it -->
  <g transform="translate(70 0) scale(2.5)" fill="none" stroke="#dce5d8" stroke-width="2" stroke-linecap="round">
    <path d="M9 25 L14.5 7" stroke-dasharray="20" stroke-dashoffset="20">
      <animate attributeName="stroke-dashoffset" from="20" to="0" begin="0.2s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </path>
    <path d="M23 25 L17.5 7" stroke-dasharray="20" stroke-dashoffset="20">
      <animate attributeName="stroke-dashoffset" from="20" to="0" begin="0.6s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </path>
    <circle cx="16" cy="18" r="3.2" fill="#d31246" stroke="none" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.35s" fill="freeze"/>
      <animate attributeName="r" values="3.2;4.3;3.2" begin="1.4s" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="110" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" letter-spacing="-0.6" fill="#f0f6fc">Roadalyx</text>
</svg>
