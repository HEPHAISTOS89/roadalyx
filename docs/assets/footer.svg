<svg xmlns="http://www.w3.org/2000/svg" width="880" height="56" viewBox="0 0 880 56" role="img" aria-label="Roadalyx">
  <rect x="1" y="1" width="878" height="54" rx="14" fill="#0e0f0e" stroke="#384137"/>

  <text x="32" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#93a091">ROADALYX</text>

  <!-- center road with dashes drifting -->
  <line x1="220" y1="28" x2="660" y2="28" stroke="#3c443a" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <!-- a crash light travelling the road -->
  <circle r="3.2" fill="#d31246">
    <animateMotion dur="7s" repeatCount="indefinite" path="M 220 28 L 660 28"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <text x="848" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6f7a6c">TxDOT CRIS · Lubbock District · 20202026</text>
</svg>
