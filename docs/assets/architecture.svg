<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="t d">
  <title id="t">Roadalyx architecture</title>
  <desc id="d">Flow 1, publish: the CRIS export (67,906 person rows) is validated and cleaned locally by python -m roadalyx into crashes.json.gz (24,261 crashes), which scripts/deploy.sh uploads to a private S3 bucket. Flow 2, serve: an analyst's browser, curl or pandas sends an HTTPS GET to the Lambda Function URL; Lambda runs FastAPI with Mangum, loads the dataset from S3 once per cold start, filters it in memory and returns JSON or CSV; every request is logged to CloudWatch Logs. An IAM role limits the function to reading that one object and writing its logs. CloudFormation creates the function, URL, role and log group.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5b6f52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2a1c; }
    .step { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #5b6f52; }
    .num { font-size: 13px; font-weight: 700; fill: #fff; }
    .h { font-size: 17px; font-weight: 650; }
    .s { font-size: 13.5px; fill: #55614f; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #3d4a38; }
    .e { font-size: 12.5px; fill: #5b6f52; font-weight: 600; }
    .edge { fill: none; stroke: #5b6f52; stroke-width: 1.8; marker-end: url(#a); }
    .dash { fill: none; stroke: #93a38a; stroke-width: 1.4; stroke-dasharray: 4 4; }
    @media (prefers-reduced-motion: reduce) { .flow { display: none; } }
  </style>

  <rect x="1" y="1" width="958" height="608" rx="18" fill="#f8faf6" stroke="#dbe2d5"/>

  <!-- 1. Publish -->
  <circle cx="40" cy="40" r="12" fill="#5b6f52"/><text x="40" y="44.5" class="num" text-anchor="middle">1</text>
  <text x="60" y="45" class="step">PUBLISH THE DATA · on a laptop, once per CRIS export</text>

  <rect x="28" y="66" width="214" height="84" rx="10" fill="#fff" stroke="#dbe2d5"/>
  <text x="46" y="96" class="h">CRIS export</text>
  <text x="46" y="118" class="m">district_crashes.csv</text>
  <text x="46" y="138" class="s">67,906 person rows</text>

  <path d="M250 108 H300" class="edge"/>

  <rect x="306" y="66" width="300" height="84" rx="10" fill="#e9f1fb" stroke="#a9c3e6"/>
  <text x="324" y="96" class="h">Python pipeline</text>
  <text x="324" y="118" class="m">python -m roadalyx</text>
  <text x="324" y="138" class="s">validate · one record per Crash ID</text>

  <path d="M614 108 H664" class="edge"/>

  <rect x="670" y="66" width="262" height="84" rx="10" fill="#fff" stroke="#dbe2d5"/>
  <text x="688" y="96" class="h">Processed dataset</text>
  <text x="688" y="118" class="m">crashes.json.gz</text>
  <text x="688" y="138" class="s">24,261 crashes · 0.9 MB</text>

  <!-- AWS boundary -->
  <rect x="296" y="196" width="646" height="396" rx="14" fill="#eef3e9" stroke="#c9d6be"/>
  <text x="316" y="222" class="step">AWS · us-east-2 · Free Tier services only</text>

  <path d="M801 158 V250" class="edge"/>
  <text x="790" y="174" class="e" text-anchor="end">upload with</text>
  <text x="790" y="190" class="m" style="font-size:12px" text-anchor="end">scripts/deploy.sh</text>

  <rect x="654" y="256" width="270" height="78" rx="10" fill="#fff5dc" stroke="#d9b86a"/>
  <text x="672" y="286" class="h">Amazon S3 · private</text>
  <text x="672" y="310" class="m">data/crashes.json.gz</text>
  <g fill="none" stroke="#a5843a" stroke-width="1.6">
    <ellipse cx="896" cy="283" rx="12" ry="4.5"/>
    <path d="M884 283 V303 C884 309 908 309 908 303 V283 M884 293 C884 299 908 299 908 293"/>
  </g>

  <!-- 2. Serve -->
  <circle cx="40" cy="300" r="12" fill="#5b6f52"/><text x="40" y="304.5" class="num" text-anchor="middle">2</text>
  <text x="60" y="305" class="step">SERVE A REQUEST</text>

  <rect x="28" y="378" width="214" height="78" rx="10" fill="#fff" stroke="#dbe2d5"/>
  <text x="46" y="408" class="h">Analyst</text>
  <text x="46" y="432" class="s">browser · curl · pandas</text>

  <path d="M250 405 H316" class="edge"/>
  <path d="M316 430 H250" class="edge"/>
  <text x="283" y="396" class="e" text-anchor="middle">GET</text>
  <text x="283" y="449" class="e" text-anchor="middle" style="font-size:11.5px">JSON / CSV</text>

  <rect x="322" y="378" width="210" height="78" rx="10" fill="#e9f1fb" stroke="#a9c3e6"/>
  <text x="340" y="408" class="h">Function URL</text>
  <text x="340" y="432" class="s">public HTTPS · GET only</text>

  <path d="M540 417 H648" class="edge"/>

  <rect x="654" y="364" width="270" height="106" rx="10" fill="#1c2618"/>
  <text x="672" y="394" class="h" style="fill:#f1f6ec">AWS Lambda</text>
  <text x="672" y="418" class="s" style="fill:#cddbc3">FastAPI + Mangum</text>
  <text x="672" y="440" class="s" style="fill:#cddbc3">filter in memory, compute</text>
  <text x="672" y="460" class="m" style="fill:#a9bba0">python3.13 · arm64 · 1 GB</text>

  <path d="M789 358 V342" class="edge"/>
  <text x="604" y="352" class="e">read once per cold start</text>

  <path d="M789 476 V512" class="edge"/>
  <text x="800" y="499" class="e">one log line per request</text>

  <rect x="654" y="518" width="270" height="58" rx="10" fill="#f1ebf9" stroke="#bea8d8"/>
  <text x="672" y="543" class="h">CloudWatch Logs</text>
  <text x="672" y="564" class="s">status and duration · kept 14 days</text>

  <!-- Permissions and infrastructure as code -->
  <rect x="322" y="482" width="300" height="100" rx="10" fill="#fff" stroke="#dbe2d5" stroke-dasharray="5 4"/>
  <text x="340" y="506" class="h" style="font-size:15px">IAM role</text>
  <text x="340" y="525" class="s">read that one S3 object, write its logs</text>
  <text x="340" y="551" class="h" style="font-size:15px">CloudFormation</text>
  <text x="340" y="570" class="m" style="font-size:12px">infra/template.yaml</text>
  <path d="M622 520 C640 520 640 470 652 462" class="dash"/>

  <!-- Moving dots: one per flow, hidden for reduced motion -->
  <g class="flow" aria-hidden="true">
    <circle r="4" fill="#3c6fb0"><animateMotion dur="6s" repeatCount="indefinite" path="M250 108 H300 M614 108 H664"/></circle>
    <circle r="4" fill="#a5843a"><animateMotion dur="6s" begin="1s" repeatCount="indefinite" path="M801 158 V250"/></circle>
    <circle r="3.5" fill="#3c6fb0"><animateMotion dur="4s" repeatCount="indefinite" path="M250 405 H316 M540 417 H648"/></circle>
    <circle r="3.5" fill="#7d5aa8"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M789 476 V512"/></circle>
  </g>
</svg>
